name: Test and deploy SpendWell

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      provision_only:
        description: Create/update AWS infrastructure only (use before adding the EC2 IP to Atlas)
        type: boolean
        default: false
      instance_type:
        description: EC2 instance size
        type: choice
        options:
          - t3.small
          - t3.medium
        default: t3.small

concurrency:
  group: spendwell-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STACK_NAME: expense-tracker-prod

jobs:
  build:
    name: Test and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: spendwell-frontend
          path: client/dist/
          retention-days: 7

  deploy:
    name: Provision and deploy on EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: spendwell-frontend
          path: client/dist/

      - name: Check AWS region
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo 'Set the AWS_REGION repository variable before deploying.' >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://infra/ec2-instance.yaml

      - name: Create or update CloudFormation stack
        run: |
          INSTANCE_TYPE="${{ inputs.instance_type || 't3.small' }}"
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/ec2-instance.yaml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "InstanceType=$INSTANCE_TYPE" \
            --no-fail-on-empty-changeset

      - name: Resolve infrastructure outputs
        shell: bash
        run: |
          STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)
          get_output() {
            jq -r --arg key "$1" '.[] | select(.OutputKey == $key) | .OutputValue' <<< "$STACK_OUTPUTS"
          }

          INSTANCE_ID=$(get_output InstanceId)
          PUBLIC_IP=$(get_output PublicIP)
          DEPLOYMENT_BUCKET=$(get_output DeploymentBucket)
          if [ -z "$INSTANCE_ID" ] || [ -z "$PUBLIC_IP" ] || [ -z "$DEPLOYMENT_BUCKET" ]; then
            echo 'The CloudFormation stack is missing one or more required outputs.' >&2
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_BUCKET=$DEPLOYMENT_BUCKET" >> "$GITHUB_ENV"
          echo "Public IP: $PUBLIC_IP"
          {
            echo '### SpendWell deployment'
            echo "- EC2 public IP: \`$PUBLIC_IP\`"
            echo '- Add this IP as an Atlas `/32` network entry before deploying the backend.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finish infrastructure-only run
        if: ${{ inputs.provision_only }}
        run: |
          echo 'Infrastructure is ready. Add the EC2 public IP to MongoDB Atlas, configure MONGODB_URI and JWT_SECRET, then run this workflow again with provision_only unchecked.'
          echo 'Provision-only run completed. Add the EC2 IP to Atlas, configure database secrets, then run a normal deployment.' >> "$GITHUB_STEP_SUMMARY"

      - name: Store production secrets in Parameter Store
        if: ${{ !inputs.provision_only }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$JWT_SECRET" ]; then
            echo 'Set the MONGODB_URI and JWT_SECRET repository secrets.' >&2
            exit 1
          fi
          aws ssm put-parameter \
            --name /expense-tracker/production/MONGODB_URI \
            --type SecureString \
            --value "$MONGODB_URI" \
            --overwrite
          aws ssm put-parameter \
            --name /expense-tracker/production/JWT_SECRET \
            --type SecureString \
            --value "$JWT_SECRET" \
            --overwrite

      - name: Create private deployment archive
        if: ${{ !inputs.provision_only }}
        run: |
          mkdir -p deployment-package
          git archive --format=tar HEAD | tar -xf - -C deployment-package
          mkdir -p deployment-package/client
          cp -a client/dist deployment-package/client/
          tar -czf expense-deploy.tar.gz -C deployment-package .
          aws s3 cp expense-deploy.tar.gz \
            "s3://$DEPLOYMENT_BUCKET/deployments/$GITHUB_SHA.tar.gz"

      - name: Start EC2 if stopped
        if: ${{ !inputs.provision_only }}
        run: |
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          case "$INSTANCE_STATE" in
            stopped)
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null
              ;;
            stopping)
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null
              ;;
            running|pending)
              ;;
            *)
              echo "Cannot deploy while EC2 instance is in state: $INSTANCE_STATE" >&2
              exit 1
              ;;
          esac
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

      - name: Wait for EC2 Systems Manager
        if: ${{ !inputs.provision_only }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)
            if [ "$PING_STATUS" = 'Online' ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Instance $INSTANCE_ID did not come online in Systems Manager." >&2
          exit 1

      - name: Deploy through Systems Manager
        if: ${{ !inputs.provision_only }}
        shell: bash
        run: |
          COMMAND="sudo cloud-init status --wait && aws s3 cp --region '$AWS_REGION' 's3://$DEPLOYMENT_BUCKET/deployments/$GITHUB_SHA.tar.gz' /tmp/expense-deploy.tar.gz && rm -rf /tmp/expense-deploy && mkdir -p /tmp/expense-deploy && tar -xzf /tmp/expense-deploy.tar.gz -C /tmp/expense-deploy && sudo bash /tmp/expense-deploy/infra/deploy.sh"
          PARAMETERS=$(jq -cn --arg command "$COMMAND" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy SpendWell commit $GITHUB_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                echo "Deployment succeeded at http://$PUBLIC_IP (add TLS before using authentication)."
                exit 0
                ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut|ExecutionTimedOut)
                break
                ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json || true
          echo 'Deployment failed or timed out.' >&2
          exit 1
